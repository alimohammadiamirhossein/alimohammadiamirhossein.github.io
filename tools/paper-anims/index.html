<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper animations · preview</title>
<style>
  body { margin: 0; padding: 24px; background: #f4f3ef; font: 14px/1.5 system-ui, sans-serif; color: #16161a; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: #6b6b73; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 20px; }
  figure { margin: 0; }
  figcaption { margin-top: 6px; font-weight: 600; }
  iframe { width: 440px; height: 220px; border: 0; border-radius: 8px; box-shadow: 0 0 0 1px #e6e3dc, 0 6px 18px rgba(0,0,0,.06); background: #fbfaf7; }
</style>
</head>
<body>
<h1>Paper animations</h1>
<p>Live scenes (edit <code>scenes/*.html</code>, refresh). Render to video with <code>python tools/paper-anims/render.py</code>.</p>
<div class="grid" id="grid"></div>
<script>
  for (const name of ["sia", "hairport", "griffin", "cora", "smite", "pose"]) {
    const f = document.createElement("figure");
    f.innerHTML = `<iframe src="scenes/${name}.html" scrolling="no" title="${name}"></iframe><figcaption>${name}</figcaption>`;
    document.getElementById("grid").appendChild(f);
  }
</script>
</body>
</html>
