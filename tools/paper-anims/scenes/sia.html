<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SIA · Selective Image Analogy</title>
<link rel="stylesheet" href="base.css">
<style>
  .toggles { position: absolute; inset: 0; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .toggle {
    flex: 1 1 auto; height: 30px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 9px;
    border: 1px solid var(--line-strong); border-radius: 6px;
    font-size: 10px; font-weight: 600; white-space: nowrap;
  }
  .sw { position: relative; width: 17px; height: 10px; border-radius: 5px; flex: none; }
  .sw i { position: absolute; top: 1.5px; width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,.18); }
  #out img { opacity: 0; }
</style>
</head>
<body>
<div class="stage">
  <!-- the analogy A : A′ :: B : B′, where only the chosen edits of A → A′ carry over -->
  <div class="ol" style="left:16px;top:14px">Demonstration</div>
  <div class="ol" style="left:202px;top:14px">Query</div>
  <div class="ol out" style="left:296px;top:14px">SIA output</div>

  <div class="frame" style="left:16px;top:28px;width:70px;height:98px"><img src="../assets/sia/a.jpg"><span class="badge">A</span></div>
  <div class="op" style="left:94px;top:77px">:</div>
  <div class="frame" style="left:102px;top:28px;width:70px;height:98px"><img src="../assets/sia/ap.jpg"><span class="badge">A′</span></div>
  <div class="op" style="left:187px;top:77px">::</div>
  <div class="frame" style="left:202px;top:28px;width:70px;height:98px"><img src="../assets/sia/b.jpg"><span class="badge">B</span></div>

  <div class="ol" style="left:16px;top:136px">Edits to transfer</div>
  <div class="ol r" id="count" style="right:168px;top:136px"></div>
  <div class="card" style="left:16px;top:150px;width:256px;height:56px"><div class="toggles" id="toggles"></div></div>

  <div class="link" style="left:284px;top:117px"></div>
  <div class="frame" id="out" style="left:296px;top:28px;width:128px;height:178px"><span class="badge">B′</span></div>
</div>
<script src="anim.js"></script>
<script>
  const EDITS = ["Lava", "Open wings", "Gold"];
  // each step flips one edit; every state is a real SIA output for that subset
  const STATES = ["100", "110", "111", "011", "001", "101"];
  const STEP = 1.3;

  const toggles = EDITS.map(name => {
    const el = document.createElement("div");
    el.className = "toggle";
    el.innerHTML = `<span class="sw"><i></i></span><span>${name}</span>`;
    document.getElementById("toggles").appendChild(el);
    return { el, sw: el.querySelector(".sw"), knob: el.querySelector("i") };
  });
  const out = document.getElementById("out");
  const imgs = {};
  STATES.forEach(s => {
    const im = document.createElement("img");
    im.src = `../assets/sia/${s}.jpg`;
    out.prepend(im);
    imgs[s] = im;
  });

  scene({
    duration: STATES.length * STEP,
    setup: () => Promise.all(Object.values(imgs).map(i => i.decode())),
    render(t) {
      const k = Math.floor(t / STEP) % STATES.length, u = t - k * STEP;
      const cur = STATES[k], prev = STATES[(k + STATES.length - 1) % STATES.length];
      const flip = A.span(u, 0, 0.28), fade = A.span(u, 0.08, 0.5);

      toggles.forEach((tg, i) => {
        const on = A.lerp(+(prev[i] === "1"), +(cur[i] === "1"), flip);
        tg.sw.style.background = A.mix("#d6d2c9", "#a6192e", on);
        tg.knob.style.left = (1.5 + 8 * on) + "px";
        tg.el.style.borderColor = A.mix("#d6d2c9", "#a6192e", on * 0.6);
        tg.el.style.background = A.mix("#ffffff", "#f8eef0", on);
        tg.el.style.color = A.mix("#9b9ba3", "#16161a", on);
      });
      document.getElementById("count").textContent = `${[...cur].filter(c => c === "1").length} of 3 on`;
      for (const [s, im] of Object.entries(imgs)) {
        im.style.opacity = s === cur ? fade : s === prev ? 1 : 0;
        im.style.zIndex = s === cur ? 2 : 1;
      }
    },
  });
</script>
</body>
</html>
